<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After Round One - Web Version</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-5">
        <div id="setup-screen" class="game-screen">
            <h1 class="text-center mb-4">👋 AFTER ROUND ONE JARE</h1>
            <div class="card shadow">
                <div class="card-body">
                    <div class="mb-4">
                        <label for="player-count" class="form-label">Number of Players (2 or more):</label>
                        <input type="number" id="player-count" class="form-control" min="2" value="2">
                    </div>
                    <div id="player-names-container"></div>
                    <button id="start-game" class="btn btn-primary w-100 mt-3">Start Game</button>
                </div>
            </div>
        </div>

        <div id="guess-screen" class="game-screen d-none">
            <h2 class="text-center mb-4">Enter Your Guesses</h2>
            <div class="card shadow">
                <div class="card-body">
                    <p id="guess-instructions" class="mb-4"></p>
                    <div id="guess-inputs"></div>
                    <button id="submit-guesses" class="btn btn-primary w-100 mt-3">Submit Guesses</button>
                </div>
            </div>
        </div>

        <div id="game-screen" class="game-screen d-none">
            <div class="row">
                <div class="col-md-8 order-md-1">
                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <h3 id="round-title" class="text-center"></h3>
                            <div id="chant-container" class="text-center my-4"></div>
                            <div id="game-status" class="text-center mb-4"></div>
                            <div id="fingers-container" class="mb-4"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 order-md-2">
                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <h4 class="text-center">Players</h4>
                            <ul id="players-list" class="list-group mb-3"></ul>
                            <div id="next-round-container" class="text-center"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="final-screen" class="game-screen d-none">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h2 id="winner-title" class="mb-4"></h2>
                    <div id="final-message" class="mb-4"></div>
                    <button id="play-again" class="btn btn-primary">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adjustment-screen" class="game-screen d-none">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="text-center mb-4">Adjust Guesses</h2>
                <div id="adjustment-inputs"></div>
                <button id="confirm-adjustments" class="btn btn-primary w-100 mt-3">Confirm Adjustments</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
